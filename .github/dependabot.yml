# Dependabot version updates: weekly, at most 5 open PRs per entry, minor + patch bumps grouped into one PR per
# ecosystem/directory to keep the noise down; majors stay separate PRs. Grouping and the PR cap apply to version updates only.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web-ui
    schedule:
